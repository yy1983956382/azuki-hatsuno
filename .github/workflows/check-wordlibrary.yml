name: Check word library
on:
  push:
    paths:
      - 'wordlibrary.xlsx'
      - 'wordlibrary.json'
      - 'scripts/sync-wordlibrary.py'
      - '.github/workflows/check-wordlibrary.yml'
  pull_request:
    paths:
      - 'wordlibrary.xlsx'
      - 'wordlibrary.json'
      - 'scripts/sync-wordlibrary.py'
      - '.github/workflows/check-wordlibrary.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/sync-wordlibrary.py --check
