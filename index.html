<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>红豆泥 | Azuki Hatsuno</title>
    <link rel="stylesheet" href="styles.css?v=16" />
  </head>
  <body>
    <main class="site-frame">
      <header class="brand-header">
        <div class="brand-title">
          <h1>红豆泥</h1>
          <p>Azuki Hatsuno</p>
        </div>
        <aside class="word-corner" aria-label="单词角">
          <div class="word-head">
            <span class="word-term" data-field="word">wordlibrary</span>
            <span class="word-phonetic" data-field="phonetic">loading</span>
          </div>
          <p class="word-meaning" data-field="wordZh">词库加载中</p>
          <p class="word-meaning word-meaning-ja" lang="ja" data-field="wordJa">単語帳を読み込み中</p>
        </aside>
      </header>

      <nav class="tabs" aria-label="首页分类">
        <a class="tab is-active" href="#weather">天气</a>
        <a class="tab" href="#notice">揭示板</a>
        <a class="tab" href="#wheel">转盘选择器</a>
      </nav>

      <div class="home-content">
        <section id="weather" class="weather-grid" aria-label="两地天气与时间">
          <article class="city-card" data-city="hangzhou">
            <div class="city-info">
              <div class="city-heading">
                <div>
                  <span class="city-kicker">天气与时间</span>
                  <h2 lang="ja">杭州</h2>
                </div>
                <time class="date" data-field="date">加载中</time>
              </div>
              <p class="time">
                <span data-field="time">--:--:--</span>
                <span class="timezone" data-field="timezone">北京时间</span>
              </p>
              <p class="lunar" data-field="lunar">农历加载中</p>
              <p class="weather-note" data-field="weather">天气加载中</p>
            </div>
            <div class="clock-wrap">
              <div class="clock" aria-hidden="true">
                <span class="hand hour"></span>
                <span class="hand minute"></span>
                <span class="hand second"></span>
                <span class="center-dot"></span>
              </div>
            </div>
          </article>

          <article class="city-card" data-city="hadano">
            <div class="city-info">
              <div class="city-heading">
                <div>
                  <span class="city-kicker">天气与时间</span>
                  <h2 lang="ja">秦野</h2>
                </div>
                <time class="date" data-field="date">加载中</time>
              </div>
              <p class="time">
                <span data-field="time">--:--:--</span>
                <span class="timezone" data-field="timezone">东京时间</span>
              </p>
              <p class="lunar" data-field="lunar">农历加载中</p>
              <p class="weather-note" data-field="weather">天气加载中</p>
            </div>
            <div class="clock-wrap">
              <div class="clock" aria-hidden="true">
                <span class="hand hour"></span>
                <span class="hand minute"></span>
                <span class="hand second"></span>
                <span class="center-dot"></span>
              </div>
            </div>
          </article>
        </section>

        <section id="notice" class="notice-section" aria-label="揭示板">
          <div class="notice-heading">
            <h2>揭示板</h2>
            <span id="noteStatus">读取 note.txt</span>
          </div>
          <div class="note-board" id="noteBoard">内容加载中</div>
        </section>
      </div>

      <section id="wheel" class="wheel-section" aria-label="转盘选择器">
        <div class="wheel-shell">
          <div class="wheel-panel">
            <div class="wheel-stage">
              <div class="wheel-pointer" aria-hidden="true"></div>
              <div class="wheel-disc" id="choiceWheel" aria-hidden="true"></div>
              <div class="wheel-center">
                <span data-field="wheelCenter">开始</span>
              </div>
            </div>
            <div class="wheel-result" aria-live="polite">
              <span>结果</span>
              <strong data-field="wheelResult">等待选择</strong>
            </div>
          </div>

          <div class="wheel-editor">
            <div class="wheel-editor-head">
              <h2>转盘选择器</h2>
              <span data-field="optionCount">0 / 8</span>
            </div>
            <label class="option-input-wrap" for="optionInput">
              <span>选项</span>
              <input id="optionInput" type="text" maxlength="24" placeholder="输入一个选项" />
            </label>
            <div class="wheel-actions">
              <button class="wheel-button is-primary" type="button" data-action="addOption">添加</button>
              <button class="wheel-button" type="button" data-action="spinWheel">开始</button>
            </div>
            <ul class="option-list" data-field="optionList"></ul>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js?v=16"></script>
  </body>
</html>
